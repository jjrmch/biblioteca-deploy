services:

  # --- Base de datos PostgreSQL ---
  postgres:
    image: postgres:16
    container_name: biblioteca-postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: biblioteca
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d biblioteca"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- Discovery (Eureka) ---
  discovery-service:
    build: ../discovery-service
    container_name: discovery-service
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8761 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Catalog ---
  catalog-service:
    build: ../catalog-service
    container_name: catalog-service
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/biblioteca
      DB_USER: admin
      DB_PASSWORD: admin123
      EUREKA_URL: http://discovery-service:8761/eureka/
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      discovery-service:
        condition: service_healthy

  # --- Transactions ---
  transactions-service:
    build: ../transactions-service
    container_name: transactions-service
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/transacciones
      DB_USER: admin
      DB_PASSWORD: admin123
      EUREKA_URL: http://discovery-service:8761/eureka/
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      discovery-service:
        condition: service_healthy

  # --- Customer ---
  customer-service:
    build: ../customer-service
    container_name: customer-service
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/clientes
      DB_USER: admin
      DB_PASSWORD: admin123
      EUREKA_URL: http://discovery-service:8761/eureka/
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      discovery-service:
        condition: service_healthy

  # --- Gateway ---
  gateway-service:
    build: ../gateway-service
    container_name: gateway-service
    environment:
      EUREKA_URL: http://discovery-service:8761/eureka/
    ports:
      - "8080:8080"
    depends_on:
      discovery-service:
        condition: service_healthy

volumes:
  postgres-data: